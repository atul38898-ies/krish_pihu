<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .preview-box {
            text-align: center;
            margin-bottom: 20px;
        }
        #pic-preview {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #007bff;
        }
        form p {
            margin-bottom: 15px;
        }
        input[type="text"], input[type="url"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Update Your Profile</h2>

    <!-- Live Image Preview दिखाने के लिए -->
    <div class="preview-box">
        <img id="pic-preview" 
             src="{{ user.userprofile.profile_pic.url }}" 
             alt="Profile Preview">
        <p style="font-size: 12px; color: #666;">Profile Photo Preview</p>
    </div>

    <!-- आपका Django फॉर्म -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Profile</button>
    </form>
</div>

<!-- JavaScript जो फोटो चुनते ही तुरंत प्रीव्यू बदलेगा -->
<script>
    const picInput = document.getElementById('id_profile_pic');
    const picPreview = document.getElementById('pic-preview');

    if (picInput) {
        picInput.addEventListener('change', function(event) {
            const file = event.target.files[0]; // चुनी हुई पहली फाइल लें
            if (file) {
                picPreview.src = URL.createObjectURL(file);
            }
        });
    }
</script>

</body>
</html>
